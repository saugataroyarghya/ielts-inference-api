[project]
name = "ielts-inference-api"
version = "0.1.0"
description = "IELTS scoring API built with BentoML"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bentoml==1.4.39",
    "ielts-speaking-scorer[inference,asr] @ https://huggingface.co/saugataroy/ielts-speaking-scorer/resolve/2c9e4cae199ce353299145231638085a83afa5b9/dist/ielts_speaking_scorer-0.2.0-py3-none-any.whl",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "torchcodec==0.17.0",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
    "pydantic==2.12.5",
    "numpy==2.5.3",
    "soundfile==0.14.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.uv.sources]
# Audio decoding stays on CPU on every inference device.
torchcodec = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: loads model weights; run explicitly, never alongside other model tests"]
addopts = "-ra -m 'not integration'"

[tool.ruff]
line-length = 100
extend-exclude = [".agents", "ielts_api/vendor/modeling_ielts.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
